name: Build signed SEVANEX APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name sevanex .

      - name: Configure permanent release signing
        env:
          KEYSTORE_B64: ${{ secrets.SEVANEX_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SEVANEX_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SEVANEX_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SEVANEX_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "Missing signing secrets. Add SEVANEX_KEYSTORE_BASE64, SEVANEX_STORE_PASSWORD, SEVANEX_KEY_PASSWORD and SEVANEX_KEY_ALIAS in GitHub repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > android/app/sevanex-upload-key.jks
          cat > android/key.properties <<PROPS
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=sevanex-upload-key.jks
          PROPS

      - name: Configure Gradle release signing
        run: |
          cat > android/app/build.gradle.kts <<'GRADLE'
          import java.util.Properties
          import java.io.FileInputStream

          plugins {
              id("com.android.application")
              id("kotlin-android")
              id("dev.flutter.flutter-gradle-plugin")
          }

          val signingProperties = Properties()
          val signingPropertiesFile = rootProject.file("key.properties")
          if (signingPropertiesFile.exists()) {
              signingProperties.load(FileInputStream(signingPropertiesFile))
          }

          android {
              namespace = "com.example.sevanex"
              compileSdk = flutter.compileSdkVersion
              ndkVersion = flutter.ndkVersion
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = JavaVersion.VERSION_17.toString() }
              defaultConfig {
                  applicationId = "com.example.sevanex"
                  minSdk = flutter.minSdkVersion
                  targetSdk = flutter.targetSdkVersion
                  versionCode = flutter.versionCode
                  versionName = flutter.versionName
              }
              signingConfigs {
                  create("release") {
                      keyAlias = signingProperties["keyAlias"] as String?
                      keyPassword = signingProperties["keyPassword"] as String?
                      storeFile = signingProperties["storeFile"]?.let { file(it) }
                      storePassword = signingProperties["storePassword"] as String?
                  }
              }
              buildTypes {
                  release { signingConfig = signingConfigs.getByName("release") }
              }
          }

          flutter { source = "../.." }
          GRADLE

      - name: Get dependencies
        run: flutter pub get

    


      - name: Build signed release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sevanex-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
