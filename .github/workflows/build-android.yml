
name: Build signed SEVANEX APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name sevanex .

      - name: Pin compatible Android Gradle and Kotlin versions
        run: |
          cat > android/settings.gradle.kts <<'GRADLE'
          pluginManagement {
              val flutterSdkPath = run {
                  val properties = java.util.Properties()
                  file("local.properties").inputStream().use { properties.load(it) }
                  requireNotNull(properties.getProperty("flutter.sdk")) {
                      "flutter.sdk not set in local.properties"
                  }
              }
              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          plugins {
              id("dev.flutter.flutter-plugin-loader") version "1.0.0"
              id("com.android.application") version "8.9.1" apply false
              id("org.jetbrains.kotlin.android") version "2.1.0" apply false
          }

          include(":app")
          GRADLE

          sed -i 's#services.gradle.org/distributions/#downloads.gradle.org/distributions/#' android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's#gradle-[0-9.]*-all.zip#gradle-8.14.3-all.zip#' android/gradle/wrapper/gradle-wrapper.properties

      - name: Configure permanent release signing
        env:
          KEYSTORE_B64: ${{ secrets.SEVANEX_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SEVANEX_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SEVANEX_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SEVANEX_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "Missing signing secrets"
            exit 1
          fi

          echo "$KEYSTORE_B64" | base64 --decode > android/app/sevanex-upload-key.jks

          cat > android/key.properties <<PROPS
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=sevanex-upload-key.jks
          PROPS

      - name: Configure Gradle release signing
        run: |
          cat > android/app/build.gradle.kts <<'GRADLE'
          import java.util.Properties
          import java.io.FileInputStream

          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("dev.flutter.flutter-gradle-plugin")
          }

          val signingProperties = Properties()
          val signingPropertiesFile = rootProject.file("key.properties")

          if (signingPropertiesFile.exists()) {
              signingProperties.load(FileInputStream(signingPropertiesFile))
          }

          android {
              namespace = "com.example.sevanex"
              compileSdk = flutter.compileSdkVersion
              ndkVersion = flutter.ndkVersion

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = JavaVersion.VERSION_17.toString()
              }

              defaultConfig {
                  applicationId = "com.example.sevanex"
                  minSdk = flutter.minSdkVersion
                  targetSdk = flutter.targetSdkVersion
                  versionCode = flutter.versionCode
                  versionName = flutter.versionName
              }

              signingConfigs {
                  create("release") {
                      keyAlias = signingProperties["keyAlias"] as String?
                      keyPassword = signingProperties["keyPassword"] as String?
                      storeFile = signingProperties["storeFile"]?.let { file(it) }
                      storePassword = signingProperties["storePassword"] as String?
                  }
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }

          flutter {
              source = "../.."
          }
          GRADLE

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Build signed release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sevanex-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
